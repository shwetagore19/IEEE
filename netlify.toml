[build]
  publish = "."

[[redirects]]
  from = "/committee"
  to = "/committee.html"
  status = 200
  force = true

[[redirects]]
  from = "/committee/"
  to = "/committee.html"
  status = 200
  force = true

[[headers]]
  for = "/committee"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/committee/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/committee.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
